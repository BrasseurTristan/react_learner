name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests et build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installation
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests (moteur, runtime, simulation de chaque niveau)
        run: npm test

      - name: Build de production
        run: npx vite build

      - name: Rapport d'équilibrage
        if: matrix.node == 24
        run: npm run balance
